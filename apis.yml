aid: bigcommerce
url: https://raw.githubusercontent.com/api-evangelist/bigcommerce/refs/heads/main/apis.yml
apis:
- aid: bigcommerce:bigcommerce-inventory
  name: Big Commerce Inventory
  tags:
  - Inventory
  - Stock
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/inventory
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/inventory
    type: Documentation
  description: >-
    BigCommerce Inventory API exposes location-aware, item-level inventory data to API consumers. You
    can get inventory levels at all locations or specific locations and update inventory levels at a specific
    location using relative or absolute adjustment endpoints. The API enables merchants to manage stock
    across multiple locations, apply inventory settings, and track adjustments for accurate fulfillment
    and reporting.
- aid: bigcommerce:bigcommerce-locations
  name: Big Commerce Locations
  tags:
  - Inventory
  - Locations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/locations
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/locations
    type: Documentation
  description: >-
    BigCommerce Locations API allows merchants to create, read, update, and delete inventory locations
    for their store. All BigCommerce stores have at least one default location, and additional locations
    can be created to track inventory against using the API. The API also supports managing metafields
    on locations, enabling custom data storage for each location. Merchants can have up to 100 active
    locations.
- aid: bigcommerce:bigcommerce-customer-segmentation
  name: Big Commerce Customer Segmentation
  tags:
  - Customers
  - Segmentation
  - Segments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/customer-segmentation
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/customer-segmentation
    type: Documentation
  description: >-
    BigCommerce Customer Segmentation API enables the creation of externally defined customer segments
    that can be targeted within promotions and other customized shopping experiences. The API allows merchants
    to group customers into segments, manage shopper profiles with a one-to-one relationship with registered
    customers, and associate profiles with segments. This API is available to enterprise customers and
    integrates with the Promotions API for targeted marketing campaigns.
- aid: bigcommerce:bigcommerce-promotions
  name: Big Commerce Promotions
  tags:
  - Coupons
  - Discounts
  - Promotions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/promotions
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/promotions
    type: Documentation
  description: >-
    BigCommerce Promotions API allows merchants to create, manage, and delete promotional campaigns and
    discount codes for their online store. A promotion is composed of a condition that a customer can
    satisfy, such as increasing their cart value above a certain amount or adding an item to their cart,
    after which an action takes place, such as a free item being added or a discount applying to the order
    total.
- aid: bigcommerce:bigcommerce-promotion-settings
  name: Big Commerce Promotion Settings
  tags:
  - Promotions
  - Settings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/promotion-settings
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/promotion-settings
    type: Documentation
  description: >-
    BigCommerce Promotion Settings API enables merchants to configure and manage global promotion settings
    for their online store. This API provides control over how promotions are applied and displayed, allowing
    businesses to customize the promotional experience and manage rules governing how different promotions
    interact with each other across the storefront.
- aid: bigcommerce:bigcommerce-pickup-methods
  name: Big Commerce Pickup Methods
  tags:
  - Fulfillment
  - Pickup
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/pickup-methods
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/pickup-methods
    type: Documentation
  description: >-
    BigCommerce Pickup Methods API allows merchants to manage pickup methods for their buy online, pick
    up in store (BOPIS) fulfillment strategy. This REST Management API enables the creation and configuration
    of pickup methods that can be associated with store locations, giving customers the option to collect
    their orders from physical store locations rather than having them shipped.
- aid: bigcommerce:bigcommerce-storefront-pickup-options
  name: Big Commerce Storefront Pickup Options
  tags:
  - Fulfillment
  - Pickup
  - Storefronts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-storefront/pickup-options
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-storefront/pickup-options
    type: Documentation
  description: >-
    BigCommerce Storefront Pickup Options API returns up to 10 available pickup options for requested
    items around a radius of provided search coordinates. The pickup options returned only include options
    where all requested items are available and can be picked up from a single location. This REST Storefront
    API endpoint enables shoppers to search for available pickup options near their location during the
    checkout process.
- aid: bigcommerce:bigcommerce-transactions
  name: Big Commerce Transactions
  tags:
  - Order
  - Payments
  - Transaction
  tags_raw:
  - Orders
  - Payments
  - Transactions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.bigcommerce.com/docs/rest-management/transactions
  properties:
  - url: https://developer.bigcommerce.com/docs/rest-management/transactions
    type: Documentation
  description: >-
    BigCommerce Transactions API provides access to order transaction data and payment actions. The API
    returns transaction details for orders, including payment method information and fraud details when
    available from the payment gateway. It also includes endpoints for payment actions such as refunds
    and void operations, enabling merchants to manage the complete payment lifecycle for their orders.
