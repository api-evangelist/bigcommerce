        $ref: '#/components/parameters/ChannelId'
    subscribe:
      operationId: onChannelInventoryProductStockChanged
      message:
        $ref: '#/components/messages/ChannelInventoryProductStockChanged'

components:
  parameters:
    ChannelId:
      description: Numeric channel identifier (e.g. `1` for the default storefront channel).
      schema:
        type: string
        pattern: '^[0-9]+$'

  schemas:
    Envelope:
      type: object
      description: |-
        Common envelope present on every BigCommerce webhook callback. Per the
        Webhooks overview, every payload includes `scope`, `store_id`,
        `producer`, `created_at`, `hash`, and `data`.
      required:
        - scope
        - store_id
        - data
        - hash
        - created_at
        - producer
      properties:
        scope:
          type: string
          description: Event scope string (e.g. `store/order/created`).
        store_id:
          type: string
          description: BigCommerce store identifier.
        producer:
          type: string
          description: Producer of the event, formatted as `stores/{store_hash}`.
          example: stores/abc123
        created_at:
          type: integer
          format: int64
          description: Unix epoch timestamp (seconds) when the event was generated.
        hash:
          type: string
          description: SHA1-encoded representation of the payload.
        data:
          type: object
          description: Event-specific data object; shape varies by scope.

    ResourceRef:
      type: object
      description: Lightweight reference identifying the resource affected by the event.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: Resource type name (e.g. `order`, `product`, `cart`).
        id:
          oneOf:
            - type: integer
            - type: string
          description: Identifier of the affected resource.

    CartData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [cart]

    CartLineItemData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [cart_line_item]
            cart_id:
              type: string
              description: Identifier of the parent cart.

    CategoryData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [category]

    CustomerData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [customer]

    CustomerAddressData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [address]
            address:
              type: object
              properties:
                customer_id:
                  type: integer

    OrderData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [order]

    OrderStatusData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [order]
            status:
              type: object
              properties:
                previous_status_id:
                  type: integer
                new_status_id:
                  type: integer

    ProductData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [product]

    ProductInventoryData:
      type: object
      description: |-
        Payload data for product-inventory events. The `inventory` object
        includes the `product_id` and either an absolute or relative change.
      properties:
        type:
          type: string
          enum: [product]
        inventory:
          type: object
          properties:
            product_id:
              type: integer
            method:
              type: string
              enum: [absolute, relative]
              description: '`absolute` for control panel/API updates; `relative` for order-driven changes.'
            value:
              type: integer
              description: The number of items the inventory level changed by (signed for relative).

    ShipmentData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [shipment]
            order_id:
              type: integer

    SkuData:
      type: object
      description: SKU event payload data including product / variant linkage.
      properties:
        type:
          type: string
          enum: [sku]
        id:
          type: integer
        sku:
          type: object
          properties:
            product_id:
              type: integer
            variant_id:
              type: integer

    SkuInventoryData:
      type: object
      description: |-
        Payload data for SKU-inventory events. The `inventory` object includes
        the `product_id`, `variant_id`, and either an absolute or relative
        change.
      properties:
        type:
          type: string
          enum: [sku]
        inventory:
          type: object
          properties:
            product_id:
              type: integer
            variant_id:
              type: integer
            method:
              type: string
              enum: [absolute, relative]
            value:
              type: integer

    SubscriberData:
      allOf:
        - $ref: '#/components/schemas/ResourceRef'
        - type: object
          properties:
            type:
              type: string
              enum: [subscriber]

    AppUninstalledData:
      type: object
