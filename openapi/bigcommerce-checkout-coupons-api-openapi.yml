openapi: 3.2.0
info:
  title: Bigcommerce Checkout Coupons API
  contact:
    name: BigCommerce
    url: https://www.bigcommerce.com
    email: support@bigcommerce.com
  version: '1.0'
  description: 'Operations tagged Checkout Coupons across 2 of this provider''s published API definitions: checkouts-openapi-original.yml, storefront-checkouts-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bigcommerce.com/stores/{store_hash}/v3
  variables:
    store_hash:
      default: store_hash
      description: Permanent ID of the BigCommerce store.
  description: BigCommerce API Gateway
- url: https://{store_domain}/api/storefront
  variables:
    store_domain:
      default: your_store.example.com
      description: The [URL authority](https://developer.mozilla.org/en-US/docs/Learn/Common_questions/Web_mechanics/What_is_a_URL#authority) of the storefront.
tags:
- name: Checkout Coupons
paths:
  /checkouts/{checkoutId}/coupons:
    post:
      tags:
      - Checkout Coupons
      summary: BigCommerce Add Coupon to Checkout
      description: 'Adds a coupon code to a checkout.


        **Required Fields**

        * coupon_code


        **Limits**

        * Coupon codes have a 50-character limit. '
      operationId: addCheckoutCoupon
      parameters:
      - $ref: '#/components/parameters/checkoutId'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Content-Type'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCodeRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Checkout'
