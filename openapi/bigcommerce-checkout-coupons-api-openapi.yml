components:
  schemas:
    MetaOpen:
      title: Response meta
      type: object
      properties: {}
      additionalProperties: true
      description: Response metadata.
    PickupOption:
      type: object
      title: Pickup Option
      properties:
        pickup_method_id:
          type: integer
    AppliedCoupon:
      title: Applied Coupon
      required:
      - code
      type: object
      properties:
        code:
          type: string
          description: The coupon code.
          example: SHOPNOW
        id:
          type: integer
          description: The coupon ID.
          example: 1
        coupon_type:
          type: string
          description: Key name to identify the type of coupon.
          example: percentage_discount
        discounted_amount:
          type: number
          description: The discounted amount applied within a given context.
          format: float
          example: 0.9
      x-internal: false
    CouponCodeRequest:
      title: Coupon Code Request
      type: object
      properties:
        coupon_code:
          type: string
          description: Coupon codes have a 50-character limit.
      x-internal: false
    Checkout:
      title: Checkout
      type: object
      x-internal: false
      properties:
        id:
          type: string
          description: ''
          format: uuid
          example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
        cart:
          title: Cart
          type: object
          properties:
            id:
              type: string
              description: Cart ID, provided after creating a cart with a POST request.
              format: uuid
              example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
            customer_id:
              type: integer
              description: ID of the customer to which the cart belongs.
              example: 1
            email:
              type: string
              description: The email address of the cart. This is the same email address that is used in the billing address.
              example: user@example.com
            currency:
              title: Currency
              type: object
              properties:
                code:
                  type: string
                  description: 'ISO-4217 currency code. (See: http://en.wikipedia.org/wiki/ISO_4217.)'
                  example: USD
            base_amount:
              type: number
              description: Sum of cart line-item amounts before cart-level discounts, coupons, or taxes are applied.
              format: double
              example: 5
            channel_id:
              type: number
              description: ID of channel
            discount_amount:
              type: number
              description: The amount includes order-level automatic promotions plus manual discounts and excludes coupon and product-based discounts.
              format: double
              example: 0.5
            cart_amount_inc_tax:
              type: number
              description: Sum of cart line-item amounts minus cart-level discounts and coupons including tax.
              format: double
              example: 4.14
            cart_amount_ex_tax:
              type: number
              description: Sum of cart line-item amounts minus cart-level discounts and coupons excluding tax.
              format: double
              example: 3.6
            coupons:
              type: array
              description: ''
              items:
                title: Applied Coupon
                type: object
                properties:
                  code:
                    type: string
                    description: The coupon code.
                    example: SHOPNOW
                  id:
                    type: integer
                    description: The coupon ID.
                    example: 1
