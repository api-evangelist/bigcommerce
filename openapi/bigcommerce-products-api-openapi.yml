    delete:
      tags:
      - Products
      summary: BigCommerce Delete Products
      description: 'To delete *Product* objects, you must include a filter. This prevents inadvertently deleting all *Product* objects in a store.


        > #### Note

        > The maximum number of products you can delete at one time is 250.


        **Example**:

        To delete products with IDs 1,2 and 3, use `DELETE /v3/catalog/products?id:in=1,2,3`.'
      operationId: deleteProducts
      parameters:
      - name: name
        in: query
        description: 'Filter items by name.

          '
        schema:
          type: string
      - name: sku
        in: query
        description: 'Filter items by SKU.

          '
        schema:
          type: string
      - name: price
        in: query
        description: 'Filter items by price.

          '
        schema:
          type: number
      - name: weight
        in: query
        description: 'Filter items by weight.

          '
        schema:
          type: number
      - name: condition
        in: query
        description: 'Filter items by condition.

          '
        schema:
          type: string
          enum:
          - new
          - used
          - refurbished
      - name: brand_id
        in: query
        description: 'Filter items by brand_id.

          '
        schema:
          type: integer
      - name: date_modified
        in: query
        description: Filter items by date_modified. For example `v3/catalog/products?date_modified:min=2018-06-15`
        schema:
          type: string
          format: date-time
      - name: date_last_imported
        in: query
        description: Filter items by date_last_imported. For example `v3/catalog/products?date_last_imported:min=2015-08-21T22%3A53%3A23%2B00%3A00`
        schema:
          type: string
          format: date-time
      - name: is_visible
        in: query
        description: 'Filter items by if visible on the storefront. '
        schema:
          type: boolean
      - name: is_featured
        in: query
        description: 'Filter items by is_featured.

          '
        schema:
          type: integer
      - name: id:in
        in: query
        description: Filter by product ID(s).
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: inventory_level
        in: query
        description: 'Filter items by inventory_level.

          '
        schema:
          type: integer
      - name: total_sold
        in: query
        description: 'Filter items by total_sold.

          '
        schema:
          type: integer
      - name: type
        in: query
        description: 'Filter items by type: `physical` or `digital`.'
        schema:
          type: string
          enum:
          - digital
          - physical
      - name: categories
        in: query
        description: "Filter items by categories.\n If a product is in more than one category, using this query will not return the product. Instead use `categories:in=12`."
        schema:
          type: integer
      - name: keyword
        in: query
        description: 'Filter items by keywords found in the `name`, `description`, or `sku` fields, or in the brand name.

          '
        schema:
          type: string
      responses:
        '204':
          description: ''
          content: {}
