          items:
            type: string
      - name: parent_id
        in: query
        description: 'Filter items by parent_id. If the category is a child or sub category it can be filtered with the parent_id. '
        schema:
          type: integer
      - name: parent_id:in
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: parent_id:min
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: parent_id:max
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: parent_id:greater
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: parent_id:less
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: page_title
        in: query
        description: 'Filter items by page_title.

          '
        schema:
          type: string
      - name: page_title:like
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: keyword
        in: query
        description: Filter items by keywords. eg. new, towel, bath
        schema:
          type: string
      - name: is_visible
        in: query
        description: 'Filter items by if visible on the storefront. '
        schema:
          type: boolean
      - name: page
        in: query
        description: Specifies the page number in a limited (paginated) list of products.
        schema:
          type: integer
      - name: limit
        in: query
        description: Controls the number of items per page in a limited (paginated) list of products.
        schema:
          type: integer
      - name: include_fields
        in: query
        description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
        schema:
          type: string
      - name: exclude_fields
        in: query
        description: Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID cannot be excluded.
        schema:
          type: string
      - name: sort
        in: query
        description: "Controls the sort order of the response, for example, `sort=name`.\n\nAllowed values: \n- `name`: sort categories in alphabetical order by category name.\n- `id`: sort in ascending order by category ID.\n- `parent_id`: sort in ascending order by the ID of the parent category.\n- `sort_order`: sort in ascending order by sort order value."
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Category Base
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/metaCollection_Full'
              example:
                data:
                - id: 19
                  parent_id: 0
                  name: Garden
                  description: <p>This is the garden description</p>
                  views: 0
                  sort_order: 2
                  page_title: page title
                  meta_keywords:
                  - meta keyword
                  meta_description: meta description
                  layout_file: category.html
                  image_url: ''
                  is_visible: true
                  search_keywords: search keywords
                  default_product_sort: use_store_settings
                  custom_url:
                    url: /garden/
                    is_customized: false
                - id: 20
