    post:
      tags:
      - Brands
      summary: BigCommerce Create a Brand
      description: 'Creates a *Brand*.


        **Required Fields**

        - name


        **Read-Only Fields**

        - id


        **Limits**

        - 30,000 brands per store limit'
      operationId: createBrand
      parameters:
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              title: Brand
              type: object
              description: Common brand properties.
              properties:
                name:
                  maxLength: 255
                  minLength: 1
                  type: string
                  description: 'The name of the brand. Must be unique.

                    Required in POST.'
                  example: Common Good
                  x-required:
                  - post
                  - put
                page_title:
                  maxLength: 255
                  minLength: 0
                  type: string
                  description: 'The title shown in the browser while viewing the brand.

                    '
                  example: Common Good
                meta_keywords:
                  type: array
                  description: 'An array of meta keywords to include in the HTML.

                    '
                  items:
                    type: string
                  example:
                  - modern
                  - clean
                  - contemporary
                meta_description:
                  maxLength: 65535
                  minLength: 0
                  type: string
                  description: 'A meta description to include.

                    '
                  example: Common Good is a modern brand.
                search_keywords:
                  maxLength: 65535
                  minLength: 0
                  type: string
                  description: 'A comma-separated list of keywords that can be used to locate this brand.

                    '
                  example: kitchen, laundry, cart, storage
                image_url:
                  type: string
                  description: 'Image URL used for this category on the storefront. Images can be uploaded via form file post to `/brands/{brandId}/image`, or by providing a publicly accessible URL in this field.

                    '
                  example: https://cdn8.bigcommerce.com/s-12345/product_images/k/your-image-name.png
                  x-url: true
                custom_url:
                  title: Custom Url Brand
                  type: object
                  description: The custom URL for the brand on the storefront.
                  properties:
                    url:
                      type: string
                      description: 'Brand URL on the storefront.

                        '
                      example: /shoes
                      x-url: true
                    is_customized:
                      type: boolean
                      description: 'Returns `true` if the URL has been changed from its default state (the auto-assigned URL that BigCommerce provides).

                        '
                      example: true
              required:
              - name
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Brand Response
                type: object
                properties:
                  data:
                    title: Brand
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Unique ID of the *Brand*. Read-Only.
                        readOnly: true
                      name:
                        maxLength: 255
                        minLength: 1
                        type: string
                        description: 'The name of the brand. Must be unique.

                          Required in POST.'
                        example: Common Good
                        x-required:
                        - post
                        - put
                      page_title:
                        maxLength: 255
                        minLength: 0
                        type: string
                        description: 'The title shown in the browser while viewing the brand.

                          '
                        example: Common Good
                      meta_keywords:
                        type: array
                        description: 'An array of meta keywords to include in the HTML.

                          '
                        items:
                          type: string
                        example:
                        - modern
                        - clean
                        - contemporary
                      meta_description:
                        maxLength: 65535
                        minLength: 0
                        type: string
                        description: 'A meta description to include.

                          '
                        example: Common Good is a modern brand.
                      search_keywords:
                        maxLength: 65535
                        minLength: 0
                        type: string
                        description: 'A comma-separated list of keywords that can be used to locate this brand.

                          '
                        example: kitchen, laundry, cart, storage
                      image_url:
                        type: string
                        description: 'Image URL used for this category on the storefront. Images can be uploaded via form file post to `/brands/{brandId}/image`, or by providing a publicly accessible URL in this field.

                          '
                        example: https://cdn8.bigcommerce.com/s-12345/product_images/k/your-image-name.png
                        x-url: true
                      custom_url:
                        title: Custom Url Brand
                        type: object
                        properties:
                          url:
                            type: string
                            description: 'Brand URL on the storefront.

                              '
                            example: /shoes
                            x-url: true
                          is_customized:
                            type: boolean
                            description: 'Returns `true` if the URL has been changed from its default state (the auto-assigned URL that BigCommerce provides).

                              '
                            example: true
                        description: The custom URL for the brand on the storefront.
                    description: Common Brand properties.
                  meta:
                    $ref: '#/components/schemas/metaEmpty_Full'
                description: 'Brand Response returns for:

                  * Create Brand

                  * Get Brand by Id

                  * Update Brand by Id'
              example:
                data:
                  id: 50
                  name: Common Good
                  meta_keywords:
                  - modern
                  - clean
                  - contemporary
                  meta_description: Common Good is a modern brand
                  image_url: ''
                  search_keywords: kitchen, laundry, cart, storage
                  custom_url:
                    url: /brands/Common-Good.html
                    is_customized: false
                meta: {}
        '207':
          $ref: '#/components/responses/General207Status'
        '409':
          description: Brand was in conflict with another brand. This is the result of duplicate unique fields such as name.
          content:
            application/json:
              schema:
                title: Error Response
                type: object
                properties:
                  errors:
                    title: Detailed Errors
                    type: object
                    properties: {}
                    additionalProperties: true
                  instance:
                    type: string
                  status:
                    type: integer
                    description: 'The HTTP status code.

                      '
                  title:
                    type: string
                    description: 'The error title describing the particular error.

                      '
                  type:
                    type: string
        '422':
          description: Brand was not valid. This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                title: Error Response
                type: object
                properties:
                  errors:
                    title: Detailed Errors
                    type: object
                    properties: {}
                    additionalProperties: true
                  instance:
                    type: string
                  status:
                    type: integer
                    description: 'The HTTP status code.

                      '
                  title:
                    type: string
                    description: 'The error title describing the particular error.

                      '
                  type:
                    type: string
      x-codegen-request-body-name: Brand
    delete:
      tags:
